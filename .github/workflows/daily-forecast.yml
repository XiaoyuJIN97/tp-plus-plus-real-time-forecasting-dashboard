name: Daily forecast

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional YYYY-MM-DD run date
        required: false
  schedule:
    # GitHub cron is UTC and can be delayed or occasionally missed. These
    # fallback triggers are guarded below so only the first one after 18:30
    # Europe/Brussels runs for a missing daily forecast file.
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"

jobs:
  forecast:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-forecast-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Check Brussels forecast window
        id: brussels_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ -n "${{ github.event.inputs.run_date }}" ]; then
              echo "run_date=${{ github.event.inputs.run_date }}" >> "$GITHUB_OUTPUT"
            else
              echo "run_date=$(TZ=Europe/Brussels date +%F)" >> "$GITHUB_OUTPUT"
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=Europe/Brussels date +%H)"
          local_minute="$(TZ=Europe/Brussels date +%M)"
          run_date="$(TZ=Europe/Brussels date +%F)"
          if [ "$local_hour" -lt 18 ] || { [ "$local_hour" = "18" ] && [ "$local_minute" -lt 30 ]; }; then
            echo "Skipping before Brussels forecast window at ${local_hour}:${local_minute}."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Auditing recent forecast dates through ${run_date} at Brussels time ${local_hour}:${local_minute}."
            echo "run_date=${run_date}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Open-Meteo realtime data
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: XiaoyuJIN97/open-meteo-realtime-data
          ref: data
          path: external/open-meteo-realtime-data
          filter: blob:none
          sparse-checkout: |
            config
            data/raw/BE
            data/raw/FR
            data/raw/DE
            data/update_manifest.csv

      - name: Checkout ENTSO-E realtime data
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: Energy-Data-Science/entsoe-realtime-data
          ref: data
          path: external/entsoe-realtime-data
          filter: blob:none
          sparse-checkout: |
            data/update_manifest.csv
            data/status.json
            data/run_history.csv
            data/hourly

      - if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python and model downloads
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/tabpfn
          key: ${{ runner.os }}-forecast-models-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-forecast-models-

      - name: Install dashboard dependencies
        if: steps.brussels_window.outputs.should_run == 'true'
        run: pip install -r requirements.txt -e .

      - name: Verify optional model runtimes
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import torch
          import xgboost
          from chronos import BaseChronosPipeline
          from tabpfn import TabPFNRegressor

          print("torch", torch.__version__)
          print("xgboost", xgboost.__version__)
          print("chronos runtime OK:", BaseChronosPipeline.__name__)
          print("tabpfn runtime OK:", TabPFNRegressor.__name__)
          PY

      - name: Run core daily forecast and rolling backfill
        if: steps.brussels_window.outputs.should_run == 'true'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          FORECAST_DEMO_MODE: "false"
          ENTSOE_REALTIME_DATA: external/entsoe-realtime-data
          ENTSOE_REALTIME_GIT_REF: HEAD
          ENTSOE_REALTIME_PREFER_LOCAL: "true"
          OPEN_METEO_REALTIME_DATA: external/open-meteo-realtime-data
          OPEN_METEO_REALTIME_GIT_REF: HEAD
          SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_weather_points_for_tp_v01_4p.csv
          LOAD_SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_load_weather_points_for_tp_v01_4p.csv
        run: |
          MODELS="tso_reference,persistence,ridge_3mo_context,chronos2_online,xgboost_online"
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python -m rt_forecast_dashboard.pipeline.run_daily --date "${{ github.event.inputs.run_date }}" --models "$MODELS"
          elif [ -n "${{ steps.brussels_window.outputs.run_date }}" ]; then
            python -m rt_forecast_dashboard.pipeline.backfill --end "${{ steps.brussels_window.outputs.run_date }}" --recent-days 5 --models "$MODELS"
          else
            python -m rt_forecast_dashboard.pipeline.backfill --recent-days 5 --models "$MODELS"
          fi

      - name: Commit core forecast outputs
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Update daily realtime forecast"
            git push
          fi

      - name: Run TabPFN daily forecast
        if: steps.brussels_window.outputs.should_run == 'true'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
          FORECAST_DEMO_MODE: "false"
          ENTSOE_REALTIME_DATA: external/entsoe-realtime-data
          ENTSOE_REALTIME_GIT_REF: HEAD
          ENTSOE_REALTIME_PREFER_LOCAL: "true"
          OPEN_METEO_REALTIME_DATA: external/open-meteo-realtime-data
          OPEN_METEO_REALTIME_GIT_REF: HEAD
          SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_weather_points_for_tp_v01_4p.csv
          LOAD_SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_load_weather_points_for_tp_v01_4p.csv
        run: |
          if [ -z "${TABPFN_TOKEN:-}" ]; then
            echo "Skipping TabPFN forecast because TABPFN_TOKEN secret is not configured."
            exit 0
          fi
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python -m rt_forecast_dashboard.pipeline.run_daily --date "${{ github.event.inputs.run_date }}" --models tabpfn_online --keep-issues
          elif [ -n "${{ steps.brussels_window.outputs.run_date }}" ]; then
            python -m rt_forecast_dashboard.pipeline.backfill --end "${{ steps.brussels_window.outputs.run_date }}" --recent-days 5 --models tabpfn_online
          else
            python -m rt_forecast_dashboard.pipeline.backfill --recent-days 5 --models tabpfn_online
          fi

      - name: Commit TabPFN forecast outputs
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No TabPFN forecast data changes."
          else
            git commit -m "Update daily TabPFN forecast"
            git push
          fi

      - name: Validate rolling forecast completeness
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          MODELS="tso_reference,persistence,ridge_3mo_context,chronos2_online,xgboost_online"
          END_DATE="${{ steps.brussels_window.outputs.run_date }}"
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            DATES="${{ github.event.inputs.run_date }}"
          else
            DATES="$(python -c "import pandas as pd; end=pd.Timestamp('${END_DATE}').date(); start=end-pd.Timedelta(days=4); print(' '.join(day.date().isoformat() for day in pd.date_range(start=start, end=end, freq='D')))")"
          fi
          failed=0
          for run_date in $DATES; do
            if python -m rt_forecast_dashboard.pipeline.check_forecast_complete --date "$run_date" --models "$MODELS"; then
              echo "Complete forecast file for ${run_date}."
            else
              echo "::warning::Forecast file is still missing or incomplete for ${run_date}."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more recent forecast dates are incomplete after the rolling backfill attempt."
            exit 1
          fi
