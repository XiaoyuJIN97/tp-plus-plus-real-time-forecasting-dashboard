name: Daily forecast

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional YYYY-MM-DD run date
        required: false
  schedule:
    # GitHub cron is UTC. These two triggers are guarded below so exactly the
    # one that lands around 18:30 Europe/Brussels runs in CET/CEST.
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Brussels forecast window
        id: brussels_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=Europe/Brussels date +%H)"
          local_minute="$(TZ=Europe/Brussels date +%M)"
          if [ "$local_hour" = "18" ] && [ "$local_minute" -ge 30 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping duplicate UTC schedule at Brussels time ${local_hour}:${local_minute}."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dashboard
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Checkout Open-Meteo realtime data
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: XiaoyuJIN97/open-meteo-realtime-data
          ref: data
          path: external/open-meteo-realtime-data
          filter: blob:none
          sparse-checkout: |
            config
            data/raw/BE
            data/raw/FR
            data/raw/DE
            data/update_manifest.csv

      - if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python and model downloads
        if: steps.brussels_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/tabpfn
          key: ${{ runner.os }}-forecast-models-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-forecast-models-

      - name: Install dashboard dependencies
        if: steps.brussels_window.outputs.should_run == 'true'
        run: pip install -r requirements.txt -e .

      - name: Verify optional model runtimes
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import torch
          import xgboost
          from chronos import BaseChronosPipeline
          from tabpfn import TabPFNRegressor

          print("torch", torch.__version__)
          print("xgboost", xgboost.__version__)
          print("chronos runtime OK:", BaseChronosPipeline.__name__)
          print("tabpfn runtime OK:", TabPFNRegressor.__name__)
          PY

      - name: Run daily forecast
        if: steps.brussels_window.outputs.should_run == 'true'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          FORECAST_DEMO_MODE: "false"
          OPEN_METEO_REALTIME_DATA: external/open-meteo-realtime-data
          OPEN_METEO_REALTIME_GIT_REF: HEAD
          SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_weather_points_for_tp_v01_4p.csv
          LOAD_SELECTED_WEATHER_POINTS: external/open-meteo-realtime-data/config/selected_load_weather_points_for_tp_v01_4p.csv
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python -m rt_forecast_dashboard.pipeline.run_daily --date "${{ github.event.inputs.run_date }}"
          else
            python -m rt_forecast_dashboard.pipeline.run_daily
          fi

      - name: Commit forecast outputs
        if: steps.brussels_window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Update daily realtime forecast"
            git push
          fi
