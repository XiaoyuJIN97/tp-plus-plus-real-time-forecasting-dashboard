name: ENTSO-E ingestion regression
on:
  pull_request:
    paths:
      - 'src/rt_forecast_dashboard/data/entsoe_client.py'
      - 'tests/test_entsoe_response_normalization.py'
      - 'requirements-forecast.txt'
      - 'scripts/recover_missing_offshore.py'
      - '.github/workflows/recover-offshore.yml'
      - '.github/workflows/entsoe-ingestion-check.yml'
  workflow_dispatch:
jobs:
  normalize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pandas: ['2.3.3', '3.0.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'pandas==${{ matrix.pandas }}' entsoe-py==0.8.1 python-dotenv pyyaml
      - run: PYTHONPATH=src pytest tests/test_entsoe_response_normalization.py -q
