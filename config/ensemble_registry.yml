settings:
  minimum_training_runs: 21
  training_window_runs: 60
  regularization: 0.1
  maximum_component_weight: 0.7
  horizon_bands:
  - - 1
    - 6
  - - 7
    - 12
  - - 13
    - 18
  - - 19
    - 24
  selection_evidence: 90-run historical mock backtest (2025-01-01 through 2025-03-31)
    using saved Chronos2, Ridge-or-XGBoost, TimesFM3, and optional TSO forecasts
selections:
  BE:
    load:
      method: constrained_learned
      include_tso: false
    solar:
      method: constrained_learned
      include_tso: true
    wind_onshore:
      method: median
      include_tso: true
    wind_offshore:
      method: constrained_learned
      include_tso: false
  DE:
    load:
      method: median
      include_tso: false
    solar:
      method: median
      include_tso: true
    wind_onshore:
      method: constrained_learned
      include_tso: true
    wind_offshore:
      method: simple_mean
      include_tso: false
  FR:
    load:
      method: constrained_learned
      include_tso: false
